name: Claims and documentation gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-claims-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate:index-change-control:run
      - run: npm run validate:claims-docs
