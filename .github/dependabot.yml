version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # Give routine releases seven days to settle; security updates are exempt.
    cooldown:
      default-days: 7
    groups:
      # One PR per week for routine minor/patch bumps; majors stay separate.
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      routine-actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]
