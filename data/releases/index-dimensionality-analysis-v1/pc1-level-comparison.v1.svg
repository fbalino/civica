<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">First component explained variance by analysis level</title><desc id="d">Comparison of pooled, between-country, within-country, and annual-change PCA.</desc><rect width="900" height="360" fill="#fff"/><text x="40" y="42" font-family="sans-serif" font-size="22" fill="#111">PC1 explained variance differs by analysis level</text><text x="40" y="105" font-family="sans-serif" font-size="15" fill="#222">Pooled levels</text><rect x="190" y="85" width="650" height="28" fill="#eee"/><rect x="190" y="85" width="567.40" height="28" fill="#315d73"/><text x="767.40" y="105" font-family="sans-serif" font-size="14" fill="#111">87.3%</text><text x="40" y="167" font-family="sans-serif" font-size="15" fill="#222">Between countries</text><rect x="190" y="147" width="650" height="28" fill="#eee"/><rect x="190" y="147" width="572.83" height="28" fill="#315d73"/><text x="772.83" y="167" font-family="sans-serif" font-size="14" fill="#111">88.1%</text><text x="40" y="229" font-family="sans-serif" font-size="15" fill="#222">Within countries</text><rect x="190" y="209" width="650" height="28" fill="#eee"/><rect x="190" y="209" width="341.49" height="28" fill="#315d73"/><text x="541.49" y="229" font-family="sans-serif" font-size="14" fill="#111">52.5%</text><text x="40" y="291" font-family="sans-serif" font-size="15" fill="#222">Annual changes</text><rect x="190" y="271" width="650" height="28" fill="#eee"/><rect x="190" y="271" width="233.34" height="28" fill="#315d73"/><text x="433.34" y="291" font-family="sans-serif" font-size="14" fill="#111">35.9%</text></svg>
